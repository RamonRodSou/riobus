quarkus:
  rest-client:
    datario-api:
      url: "https://dados.mobilidade.rio"
      enable-compression: true

  datasource:
    db-kind: postgresql
    username: postgres
    password: "1234"
    jdbc:
      url: jdbc:postgresql://localhost:5433/postgres
      statement-batch-size: 50
      max-lifetime: 1800s

  hibernate-orm:
    database:
      generation: update
    log:
      sql: true
  transaction-manager:
    default-transaction-timeout: 3600s

riobus:
  geo:
    raio-terra-km: 6371
  api:
    limite-onibus: 5
    intervalo-cache: "60s"

nginx:
  image: nginx:latest
  ports:
    - "80:80"
  volumes:
    - ./docker/nginx/nginx.conf
  depends_on:
    - backend