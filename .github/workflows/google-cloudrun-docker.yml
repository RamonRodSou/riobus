name: 'Automated Platform Deploy'

on:
  push:
    branches:
      - 'main'

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  build-and-deploy:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout do Codigo'
        uses: 'actions/checkout@v4'

      - name: 'Configurar Java 21'
        uses: 'actions/setup-java@v4'
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - id: 'auth'
        name: 'Autenticacao no GCP (WIF)'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          service_account: '${{ vars.GCP_SA_EMAIL }}'
          project_id: '${{ vars.GCP_PROJECT_ID }}'

      - name: 'Configurar Login do Docker no Artifact Registry'
        run: |-
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev

      - name: 'Build e Push da Imagem Docker'
        run: |-
          # 1. Compila o projeto e gera o JAR do Quarkus
          mvn clean package -DskipTests

          # 2. Define a URL da imagem (usando seu repo apps-backend)
          IMAGE_URL="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/${{ vars.APP_NAME }}:${{ github.sha }}"
          
          # 3. Constroi a imagem usando o seu Dockerfile
          docker build -t $IMAGE_URL .
          
          # 4. Envia a imagem para o Artifact Registry
          docker push $IMAGE_URL

      - name: 'Deploy no Cloud Run'
        id: 'deploy'
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: '${{ vars.APP_NAME }}'
          region: '${{ vars.GCP_REGION }}'
          image: '${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/${{ vars.APP_NAME }}:${{ github.sha }}'
          # Conexao com a rede privada para o banco de dados
          flags: '--allow-unauthenticated --network=apps-vpc --subnet=subnet-us-central1 --vpc-egress=private-ranges-only'
          # Variaveis de ambiente para o Quarkus
          env_vars: |-
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_URL=jdbc:postgresql://${{ secrets.DB_INTERNAL_IP }}:5432/riobus
            DB_GENERATION=none
            LOG_SQL=false

      - name: 'Sucesso'
        run: |-
          echo "Deploy finalizado com sucesso!"
          echo "URL do Cloud Run: ${{ steps.deploy.outputs.url }}"