name: 'Automated Platform Deploy'

on:
  push:
    branches:
      - 'main'

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  build-and-deploy:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout do Codigo'
        uses: 'actions/checkout@v4'

      - name: 'Configurar Java 21'
        uses: 'actions/setup-java@v4'
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - id: 'auth'
        name: 'Autenticacao no GCP (WIF)'
        uses: 'google-github-actions/auth@v2'
        with:
          token_format: 'access_token'
          workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          service_account: '${{ vars.GCP_SA_EMAIL }}'
          project_id: '${{ vars.GCP_PROJECT_ID }}'

      - name: 'Configurar Login do Docker no Artifact Registry'
        run: |-
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev

      - name: 'Build e Push da Imagem Docker'
        run: |-
          # Validacao de seguranca para evitar erro de URL //
          if [ -z "${{ vars.GCP_PROJECT_ID }}" ]; then echo "ERRO: GCP_PROJECT_ID vazio"; exit 1; fi
          
          # 1. Compila o JAR do Quarkus
          mvn clean package -DskipTests
          
          # 2. Define a URL da imagem
          IMAGE_URL="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/${{ vars.APP_NAME }}:${{ github.sha }}"
          
          # 3. Build apontando para o Dockerfile do Quarkus (JVM mode)
          # Se o seu arquivo tiver outro nome, ajuste aqui:
          docker build -f src/main/docker/Dockerfile.jvm -t $IMAGE_URL .
          
          # 4. Push para o Google Cloud
          docker push $IMAGE_URL

      - name: 'Deploy no Cloud Run'
        id: 'deploy'
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: '${{ vars.APP_NAME }}'
          region: '${{ vars.GCP_REGION }}'
          image: '${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/${{ vars.APP_NAME }}:${{ github.sha }}'
          flags: '--allow-unauthenticated --network=apps-vpc --subnet=estudo-subrede --vpc-egress=private-ranges-only'
          env_vars: |-
            QUARKUS_DATASOURCE_USERNAME=${{ secrets.DB_USER }}
            QUARKUS_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }}
            QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://${{ secrets.DB_INTERNAL_IP }}:5432/riobus
            QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION=none
            QUARKUS_HIBERNATE_ORM_LOG_SQL=false
            QUARKUS_HTTP_HOST=0.0.0.0
            QUARKUS_DATASOURCE_JDBC_ACQUISITION_TIMEOUT=45
            QUARKUS_DATASOURCE_JDBC_INITIAL_SIZE=1
            QUARKUS_DATASOURCE_JDBC_MIN_SIZE=1
            QUARKUS_DATASOURCE_JDBC_MAX_SIZE=5
            QUARKUS_DATASOURCE_JDBC_BACKGROUND_VALIDATION_INTERVAL=10s

      - name: 'Sucesso'
        run: |-
          echo "Deploy finalizado com sucesso!"
          echo "URL do Cloud Run: ${{ steps.deploy.outputs.url }}"